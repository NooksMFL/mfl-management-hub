<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
@font-face{font-family:Hub;src:url(READ_FONT_URL)}@font-face{font-family:Hub;src:url(BOLD_FONT_URL);font-weight:700}*{box-sizing:border-box}body{margin:0;background:#202433;color:#eff3fa;font:15px/1.5 Hub,Arial,sans-serif}.scroll{overflow:auto;max-height:450px;border:1px solid #3c4860;border-radius:6px}table{border-collapse:collapse;width:100%;white-space:nowrap}th,td{padding:12px 14px;text-align:left;border-bottom:1px solid #343e54}td.number{text-align:right;font-variant-numeric:tabular-nums}thead{position:sticky;top:0;z-index:1;background:#2b3549}button{font:700 14px Hub,Arial;color:#b9eee4;background:transparent;border:0;cursor:pointer;text-align:left;white-space:nowrap;padding:0}button:focus-visible{outline:2px solid #b9eee4;outline-offset:4px}tbody tr:hover{background:#2b3449}.hint{color:#a8bbcf;font-size:12px;margin:0 0 8px}
body{background:#fffdf4;color:#212724;font-size:13px}.scroll{border:1px solid #bdbcae;border-radius:2px}th,td{padding:10px 12px;border-color:#d2cebb}thead{background:#ffdf59}button{color:#212724;font-size:12px}button:focus-visible{outline-color:#6c5b00}tbody tr:hover{background:#fff2b8}.hint{color:#62675c;font-size:11px}body{background:#080f19!important;color:#ecf2fa!important}button,select,button.secondary{background:#101b2a!important;color:#c4d0df!important;border:1px solid #34455d!important;border-radius:6px!important}button:hover{background:#233629!important;color:#d5ebae!important}p,.help,.summary,.hint{color:#96a6bb!important}h2,h3{color:#eef3fa!important}#auto,#image{background:#283a20!important;color:#d2ed99!important;border-color:#617d2d!important}#status{background:#142332!important;color:#c7d5e4!important;border-color:#30465d!important;border-radius:7px!important}.bench{background:#0c1725!important;border-color:#28374c!important;border-radius:9px!important}.player{background:#101b2a!important;color:#f0f4fa!important;border-color:#2c3c52!important;border-radius:8px!important}.card-name{color:#eef3fa!important}.player small,.card-ovr small{color:#93a7bf!important}.card-ovr{color:#7cd5ff!important}.face{background:#20334a!important;color:#b7dba5!important;border-radius:50%!important}.slot .player{background:#101b2a!important}.scroll{border-color:#28374c!important;border-radius:8px!important}th,td{border-color:#28374c!important}thead{background:#17273b!important}thead button{background:transparent!important;color:#b8d393!important;border:0!important}tbody tr:hover{background:#1d2e3d!important}#error{color:#f09b9b!important}</style></head><body><p class="hint">Highest gains first. Click a numeric heading once for highest → lowest; click again to reverse.</p><div class="scroll"><table aria-label="Progression leaderboard"><thead><tr id="head"></tr></thead><tbody id="rows"></tbody></table></div><script>
const DATA=/*TABLE_DATA*/;let sort=DATA.sortBy,descending=true;const numeric=new Set(DATA.numeric);
function render(){const head=document.getElementById('head'),body=document.getElementById('rows');head.replaceChildren();body.replaceChildren();for(const col of DATA.columns){const th=document.createElement('th');th.setAttribute('scope','col');th.setAttribute('aria-sort',col===sort?(descending?'descending':'ascending'):'none');const b=document.createElement('button');b.textContent=col+(col===sort?(descending?' ↓':' ↑'):'');b.onclick=()=>{if(sort===col)descending=!descending;else{sort=col;descending=numeric.has(col);}render();};th.append(b);head.append(th);}const rows=[...DATA.rows].sort((a,b)=>{const va=a[sort],vb=b[sort];if(va===null||va===undefined)return vb==null?0:1;if(vb===null||vb===undefined)return -1;const comparison=numeric.has(sort)?Number(va)-Number(vb):String(va).localeCompare(String(vb));return descending?-comparison:comparison;});for(const row of rows){const tr=document.createElement('tr');for(const col of DATA.columns){const td=document.createElement('td');td.textContent=row[col]??'—';if(numeric.has(col))td.className='number';tr.append(td);}body.append(tr);}}render();
</script></body></html>
